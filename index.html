<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برای مهشید ❤️</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050505}
body{font-family:Vazirmatn,Tahoma,sans-serif;color:#f4dfb1;overflow-x:hidden}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;
 background:radial-gradient(circle at 50% 35%,rgba(161,111,35,.16),transparent 34%),radial-gradient(circle at 20% 80%,rgba(113,26,26,.10),transparent 30%);
}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.card{
 width:min(94vw,560px);min-height:720px;position:relative;overflow:hidden;
 border:1px solid #a77b35;border-radius:28px;
 background:linear-gradient(145deg,#111 0%,#070707 60%,#0d0a07 100%);
 box-shadow:0 25px 90px rgba(0,0,0,.8),inset 0 0 45px rgba(198,151,70,.04);
 padding:42px 25px 30px;text-align:center;
}
.card:after{content:"";position:absolute;inset:10px;border:1px solid rgba(199,157,84,.18);border-radius:21px;pointer-events:none}
.orn{font-size:34px;color:#d4a85d;animation:pulse 2.5s infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.72}}
h1{font-family:Georgia,serif;font-size:40px;margin:9px 0 4px;color:#e3bb70;font-weight:500}
.subtitle{font-size:16px;line-height:2;color:#ddd0b6;margin:0 auto;max-width:410px}
.divider{margin:25px auto;width:190px;color:#c5964c}
.options{display:grid;gap:16px;margin:30px auto 0;max-width:430px;position:relative;z-index:2}
.option{
 appearance:none;width:100%;border:1px solid #a97b35;border-radius:20px;
 background:linear-gradient(135deg,#15110b,#090909);
 color:#f4ddb0;padding:20px 18px;cursor:pointer;
 transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.35)
}
.option:hover{transform:translateY(-3px);border-color:#e0b96e;box-shadow:0 15px 40px rgba(0,0,0,.55)}
.icon{font-size:29px;display:block;margin-bottom:5px}
.label{font-size:21px;font-weight:600}
.hint{display:block;font-size:13px;color:#a99d87;margin-top:5px}
.footer{margin-top:35px;font-size:14px;color:#a99d87}
.result{display:none;position:relative;z-index:3;margin:27px auto 0;padding:25px 18px;border:1px solid #a77b35;border-radius:20px;background:#0d0c0a}
.result.show{display:block;animation:appear .6s ease}
@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.result h2{color:#e0b76b;font-size:24px;margin:0 0 12px}
.result p{line-height:2;color:#e7dcc7;margin:0}
.back{margin-top:17px;border:0;background:transparent;color:#9e8b69;cursor:pointer}
.heart{position:fixed;bottom:-30px;font-size:20px;opacity:.6;animation:float 8s linear infinite;pointer-events:none}
@keyframes float{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.note{font-size:12px;color:#716956;margin-top:14px}
.telegramBtn{
 display:block;margin:18px auto 0;max-width:360px;padding:13px 16px;
 border:1px solid #a77b35;border-radius:14px;text-decoration:none;
 background:linear-gradient(135deg,#18120a,#0b0b0b);
 color:#f4ddb0;font-size:15px;font-weight:600;
 transition:.2s
}
.telegramBtn:hover{transform:translateY(-2px);border-color:#e0b96e}
</style>
</head>
<body>
<div class="wrap">
<section class="card">
  <div class="orn">♡</div>
  <h1>عشق من</h1>
  <p class="subtitle">برای تولدت، یک شب خاص برات آماده کردم...<br>اما این بار انتخابش با خودته ❤️</p>
  <div class="divider">──── ♥ ────</div>

  <div id="options" class="options">
    <button class="option" onclick="choose(1)">
      <span class="icon">🌙</span>
      <span class="label">یک شب خاص</span>
      <span class="hint">یک انتخاب متفاوت و دونفره</span>
    </button>
    <button class="option" onclick="choose(2)">
      <span class="icon">✨</span>
      <span class="label">یک شب رمانتیک</span>
      <span class="hint">یک شام قشنگ و خاطره‌انگیز</span>
    </button>
  </div>

  <div id="result" class="result">
    <h2 id="resultTitle"></h2>
    <p id="resultText"></p>
    <div style="font-size:28px;margin-top:15px">❤️</div>
    <p style="font-size:14px;margin-top:10px;color:#b9aa8f">انتخابت ثبت شد... بقیه‌ش رو بسپار به من.</p>
    <a id="telegramBtn" class="telegramBtn" href="#" target="_blank" rel="noopener">انتخابم رو برای عشقم بفرست ❤️</a>
    <button class="back" onclick="resetChoice()">تغییر انتخاب</button>
  </div>

  <div class="footer">انتخاب با توست، عشق من.</div>
  <div class="note">یک شب فقط برای ما دو نفر</div>
</section>
</div>

<script>
function choose(n){
 const result=document.getElementById('result');
 const title=document.getElementById('resultTitle');
 const text=document.getElementById('resultText');
 const telegramBtn=document.getElementById('telegramBtn');
 document.getElementById('options').style.display='none';

 let choiceTitle, message;
 if(n===1){
   choiceTitle='یک شب خاص 🌙';
   title.textContent=choiceTitle;
   text.innerHTML='شام دونفره، یک اتاق دنج، کیک و یک سورپرایز کوچک...<br>و شبی که فقط برای با هم بودنمونه.';
   message='عشق من ❤️ من «یک شب خاص» رو انتخاب کردم 🌙🥰';
 }else{
   choiceTitle='یک شب رمانتیک ✨';
   title.textContent=choiceTitle;
   text.innerHTML='یک رستوران شیک، شام دونفره، یک کادوی کوچک از طرف من<br>و کلی لحظه قشنگ کنار هم.';
   message='عشق من ❤️ من «یک شب رمانتیک» رو انتخاب کردم ✨🥰';
 }

 telegramBtn.href='https://t.me/Matinkazuki?text='+encodeURIComponent(message);
 result.classList.add('show');
 for(let i=0;i<8;i++) setTimeout(makeHeart,i*140);
}
function resetChoice(){
 document.getElementById('result').classList.remove('show');
 document.getElementById('options').style.display='grid';
 document.getElementById('telegramBtn').href='#';
}
function makeHeart(){
 const h=document.createElement('div');h.className='heart';h.textContent='♥';
 h.style.left=Math.random()*100+'vw';h.style.animationDuration=(6+Math.random()*5)+'s';
 document.body.appendChild(h);setTimeout(()=>h.remove(),11000);
}
</script>
</body>
</html>
